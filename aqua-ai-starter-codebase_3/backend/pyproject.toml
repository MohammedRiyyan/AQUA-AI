[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Keep the default-style checks (pycodestyle errors, pyflakes) plus import sorting and pyupgrade.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # long lines are fine (formatting is not enforced)

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
